name: Build Windows application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test core behavior
        run: npm test
      - name: Verify bundled WCL Lab on Windows with synthetic data
        run: node tests/lab-native.mjs
      # The real-addon DecodePack test is explicitly skipped here: it needs the
      # external Smart Reminders checkout and Lua 5.1. It passed in the cloud build.
      - name: Package Windows x64
        run: npm run package:win
      - name: Launch packaged desktop and verify IPC, AI transport and pack codec
        env:
          DOCTOR_APP: ${{ github.workspace }}/release/Pztk x Glyalith-win32-x64/resources/app.asar
          DOCTOR_PROFILE: windows-packaged
        run: node tests/desktop.mjs
      - name: Record artifact checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $archive = "release/Pztk-x-Glyalith-$version-Windows-x64.zip"
          $digest = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$digest  Pztk-x-Glyalith-$version-Windows-x64.zip" | Set-Content release/SHA256SUMS.txt
      - name: Verify Windows ZIP extraction
        shell: pwsh
        run: |
          $archive = Get-ChildItem release/Pztk-x-Glyalith-*-Windows-x64.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath release/extraction-check
          $asar = Get-ChildItem release/extraction-check -Recurse -Filter app.asar
          if (-not $asar) { throw 'Packaged application archive is missing.' }
          if (-not (Get-ChildItem release/extraction-check -Recurse -Filter 'Pztk x Glyalith.exe')) { throw 'Windows executable is missing.' }
      - name: Upload downloadable Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: Pztk-x-Glyalith-Windows-x64
          path: |
            release/Pztk-x-Glyalith-*-Windows-x64.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Publish versioned Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq '.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the current release commit.' }
          if ($latest -ne $env:GITHUB_SHA) {
            Write-Host 'A newer main commit exists; leave publication to its build.'
            exit 0
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'This version is already released; its assets are preserved. The current build remains available as an Actions artifact.'
            exit 0
          }
          gh release create $tag "release/Pztk-x-Glyalith-$version-Windows-x64.zip" release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Pztk x Glyalith $version — Windows x64" --notes-file resources/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
